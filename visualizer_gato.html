<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sismo Cat Visualizer</title>
  <style>
    :root { --ink: #f5efe4; --muted: #a99f91; --accent: #f3b562; --bg: #151312; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 50% 0, #49342d, var(--bg) 55%); font: 14px Georgia, serif; }
    main { width: min(1120px, calc(100% - 32px)); margin: auto; padding: 28px 0 42px; }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 18px; }
    h1 { margin: 4px 0 0; font-size: clamp(30px, 5vw, 58px); font-weight: 400; }
    .eyebrow { color: var(--accent); font: 11px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    .status { color: var(--muted); font: 12px Arial, sans-serif; text-align: right; }
    .status strong { display: block; color: var(--accent); margin-bottom: 4px; }
    .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #090909; border: 1px solid #60493d; box-shadow: 0 20px 60px #0008; }
    video { width: 100%; height: 100%; display: block; object-fit: cover; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid #4c4038; }
    label, button { font: 12px Arial, sans-serif; }
    button { border: 1px solid #896d52; color: var(--ink); background: #34251e; padding: 9px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    input[type=file] { max-width: 240px; font: 11px Arial, sans-serif; }
    .hint { color: var(--muted); font: 11px Arial, sans-serif; }
    @media (max-width: 650px) { header { display: block; } .status { text-align: left; margin-top: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Seismic cat / live response</div><h1>O gato escuta</h1></div>
      <div class="status"><strong id="activity">A aguardar atividade</strong><span id="updated">Sem dados carregados</span></div>
    </header>
    <section class="stage" id="stage">
      <video id="catVideo" autoplay loop muted playsinline></video>
    </section>
    <div class="controls">
      <button id="pause" type="button">Pausa</button>
      <span class="hint" id="hint">O vídeo pausa brevemente quando há atividade sísmica.</span>
    </div>
  </main>
  <script>
    const video = document.getElementById("catVideo");
    const activityLabel = document.getElementById("activity");
    const updatedLabel = document.getElementById("updated");
    const defaultVideo = "WhatsApp Video 2026-09-17 at 21.19.58.mp4";
    let lastEventKey = "";
    let lastActivityAt = 0;

    video.src = defaultVideo;
    video.addEventListener("error", () => {
      document.getElementById("hint").textContent = "Não foi possível carregar o vídeo do gato.";
    });
    document.getElementById("pause").addEventListener("click", event => {
      if (video.paused) { video.play(); event.target.textContent = "Pausa"; }
      else { video.pause(); event.target.textContent = "Reproduzir"; }
    });
    async function pollActivity() {
      try {
        const response = await fetch("orquestra_sismo_events.csv?" + Date.now());
        if (!response.ok) throw new Error("sem registo");
        const lines = (await response.text()).trim().split(/\r?\n/);
        const latest = lines[lines.length - 1] || "";
        if (latest && latest !== lastEventKey && lastEventKey) {
          lastActivityAt = Date.now();
          video.pause();
          activityLabel.textContent = "Atividade sísmica: vídeo parado";
          setTimeout(() => { if (!video.ended) video.play(); }, 1800);
        }
        lastEventKey = latest;
        if (Date.now() - lastActivityAt > 1800) activityLabel.textContent = "A aguardar atividade";
        updatedLabel.textContent = "Registo atualizado " + new Date().toLocaleTimeString();
      } catch (_) { activityLabel.textContent = "A aguardar registo"; }
    }
    pollActivity(); setInterval(pollActivity, 1000);
  </script>
</body>
</html>
