<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sismo Cat Motion</title>
  <style>
    :root { --ink:#f2f0e9; --muted:#9da39e; --line:#293537; --bg:#071012; --accent:#f4a261; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:radial-gradient(circle at 85% 0,#183b3a 0,transparent 35%),var(--bg); font:15px Georgia,serif; }
    main { width:min(1080px,calc(100% - 36px)); margin:auto; padding:30px 0 42px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:18px; }
    h1 { margin:4px 0 0; font-size:clamp(30px,5vw,58px); font-weight:400; }
    .kicker { color:var(--accent); text-transform:uppercase; letter-spacing:2px; font:11px Arial,sans-serif; }
    .status { text-align:right; color:var(--muted); font:12px Arial,sans-serif; }
    .status strong { display:block; color:var(--accent); margin-bottom:4px; }
    .stage { position:relative; aspect-ratio:16/9; overflow:hidden; background:#111b1d; border:1px solid var(--line); }
    #catImage { width:100%; height:100%; object-fit:contain; display:block; }
    #catOverlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:auto; }
    .controls { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
    button,input { color:var(--ink); background:#1a292a; border:1px solid #41605d; border-radius:4px; padding:9px 12px; font:12px Arial,sans-serif; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .hint { color:var(--muted); font:11px Arial,sans-serif; }
  </style>
</head>
<body>
  <main>
    <header><div><div class="kicker">TouchDesigner-ready motion study</div><h1>Cat / Seismic Input</h1></div><div class="status"><strong id="state">A aguardar input</strong><span id="time">Sem imagem</span></div></header>
    <section class="stage"><img id="catImage" alt="Desenho do gato"><canvas id="catOverlay"></canvas></section>
    <div class="controls">
      <input id="imagePicker" type="file" accept="image/*">
      <button id="calibrate" type="button">Calibrar olhos</button>
      <label>Threshold <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.08"></label>
      <span class="hint" id="hint">Escolhe a imagem e clica no centro dos dois olhos. Um evento acima do threshold congela o movimento.</span>
    </div>
  </main>
  <script>
    const image = document.getElementById("catImage");
    const canvas = document.getElementById("catOverlay");
    const ctx = canvas.getContext("2d");
    const state = document.getElementById("state");
    const timeLabel = document.getElementById("time");
    const defaultImage = "gato.png";
    let eyes = [{ x:.42, y:.38 }, { x:.58, y:.38 }];
    let calibrating = false;
    let eyeIndex = 0;
    let frozenUntil = 0;
    let lastEvent = "";
    let threshold = .08;

    image.src = defaultImage;
    image.addEventListener("error", () => { timeLabel.textContent = "Escolhe o desenho do gato"; });
    document.getElementById("imagePicker").addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) { image.src = URL.createObjectURL(file); timeLabel.textContent = file.name; }
    });
    document.getElementById("threshold").addEventListener("input", event => { threshold = Number(event.target.value); });
    document.getElementById("calibrate").addEventListener("click", event => {
      calibrating = !calibrating; eyeIndex = 0;
      event.target.textContent = calibrating ? "Clica nos olhos" : "Calibrar olhos";
      document.getElementById("hint").textContent = calibrating ? "Clica no centro do olho esquerdo e depois do direito." : "Olhos calibrados.";
    });
    canvas.addEventListener("click", event => {
      if (!calibrating) return;
      const rect = canvas.getBoundingClientRect();
      eyes[eyeIndex] = { x:(event.clientX-rect.left)/rect.width, y:(event.clientY-rect.top)/rect.height };
      eyeIndex += 1;
      if (eyeIndex === 2) { calibrating = false; document.getElementById("calibrate").textContent = "Calibrar olhos"; }
    });
    function resize() { const ratio=devicePixelRatio||1; canvas.width=canvas.clientWidth*ratio; canvas.height=canvas.clientHeight*ratio; ctx.setTransform(ratio,0,0,ratio,0,0); }
    function draw(time) {
      resize(); ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
      if (calibrating) { ctx.strokeStyle="#f4a261"; eyes.forEach(eye=>{ctx.beginPath();ctx.arc(eye.x*canvas.clientWidth,eye.y*canvas.clientHeight,12,0,Math.PI*2);ctx.stroke();}); requestAnimationFrame(draw); return; }
      const frozen = performance.now() < frozenUntil;
      const movement = frozen ? 0 : Math.sin(time/500)*5;
      eyes.forEach(eye => { const x=eye.x*canvas.clientWidth+movement, y=eye.y*canvas.clientHeight; ctx.fillStyle="#111"; ctx.beginPath(); ctx.ellipse(x,y,7,10,0,0,Math.PI*2); ctx.fill(); });
      requestAnimationFrame(draw);
    }
    async function poll() {
      try {
        const response=await fetch("orquestra_sismo_events.csv?"+Date.now());
        const lines=(await response.text()).trim().split(/\r?\n/); const latest=lines[lines.length-1]||"";
        const parts=latest.split(","); const amplitude=Number(parts[2]);
        if (latest && latest!==lastEvent && lastEvent && amplitude>=threshold) { frozenUntil=performance.now()+1800; state.textContent="Input sísmico: olhos parados"; setTimeout(()=>state.textContent="A aguardar input",1800); }
        lastEvent=latest; timeLabel.textContent="Registo atualizado "+new Date().toLocaleTimeString();
      } catch (_) { state.textContent="A aguardar registo"; }
    }
    window.addEventListener("resize",resize); resize(); poll(); setInterval(poll,1000); requestAnimationFrame(draw);
  </script>
</body>
</html>
